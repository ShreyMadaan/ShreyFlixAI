[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/tmdb/*"
  to = "/.netlify/functions/tmdb?path=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/recommendations"
  to = "/.netlify/functions/recommendations"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
